# Sunucu tarafı servisler — üretim/VPS dağıtımı için.
#
#   panel       Next.js paneli (Vercel yerine burada koşar)
#   waha        WhatsApp köprüsü (giden fatura mesajı, gelen dekont)
#   dekont      Dekont okuma servisi (FastAPI + Tesseract OCR)
#   hatirlatma  Günlük hatırlatmayı tetikleyen zamanlayıcı
#   caddy       TLS sonlandırma, üçünün önünde
#
# Panel, waha ve dekont'a container ağı üzerinden ulaşır; dışarıya tek kapı
# Caddy'dir. Veritabanı ve dosya deposu Supabase'de, bu sunucuda durum yok.
#
# Her müşteri kendi WhatsApp Business numarasıyla bunun ayrı bir kopyasını
# çalıştırır (bkz. README "WhatsApp otomasyonu" bölümü). Ayağa kaldırmak için
# aşağıdaki değişkenleri kendi değerlerinizle doldurup:
#
#   docker compose up -d
#
# WAHA oturum verisi `waha_data` volume'ünde kalıcı tutulur — container yeniden
# başlasa da (VPS reboot, imaj güncellemesi vb.) QR'ı tekrar taratmanız
# gerekmez. Dekont servisi durumsuzdur, volume istemez.

services:
  waha:
    image: devlikeapro/waha
    container_name: waha
    restart: unless-stopped
    # Disariya Caddy uzerinden HTTPS ile aciliyor; bu eslesme yalnizca
    # sunucunun kendi icinden (ssh ile girip curl atmak gibi) erisim icin.
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      # Hepsi zorunlu: WAHA artik Caddy uzerinden internete acik duruyor,
      # anahtarsiz birakmak panoyu ve API'yi herkese acardi.
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY tanimlanmali}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:?WAHA_DASHBOARD_USERNAME tanimlanmali}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?WAHA_DASHBOARD_PASSWORD tanimlanmali}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
    volumes:
      - waha_data:/app/.sessions

  dekont:
    build: ./python-dekont-servisi
    container_name: dekont
    restart: unless-stopped
    # Bkz. waha: public erisim Caddy'den, bu yalnizca sunucu ici.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Zorunlu: tanımlı değilse servis hiçbir istek kabul etmez (fail-closed).
      # Vercel'deki DEKONT_SERVICE_KEY ile birebir aynı değer olmalı.
      DEKONT_SERVICE_KEY: ${DEKONT_SERVICE_KEY:?DEKONT_SERVICE_KEY tanimlanmali}

  panel:
    build:
      context: .
      args:
        # Tarayiciya ulasmasi gerektigi icin derleme aninda gomulur.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?tanimlanmali}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?tanimlanmali}
    container_name: panel
    restart: unless-stopped
    # Disariya Caddy uzerinden; bu eslesme yalnizca sunucu ici hata ayiklama.
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      # Panelin kendi genel adresi — kiraciya giden dekont linki ve Supabase
      # davet yonlendirmesi bundan uretilir. Calisma aninda okunur, imaja
      # gomulu degildir (bkz. lib/site-url.ts).
      SITE_URL: "https://panel.${DOMAIN:?DOMAIN tanimlanmali - ornek.com gibi}"
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?tanimlanmali}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?tanimlanmali}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?tanimlanmali}
      DEKONT_SERVIS_URL: http://dekont:8000
      DEKONT_SERVICE_KEY: ${DEKONT_SERVICE_KEY:?DEKONT_SERVICE_KEY tanimlanmali}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET tanimlanmali}
      WAHA_URL: ${WAHA_URL-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY tanimlanmali}
      WAHA_SESSION: ${WAHA_SESSION-default}
      # Bos birakilirsa webhook TUM istekleri reddeder, yani kiracinin
      # sohbete attigi dekont sessizce dusmeye baslar.
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET:?WAHA_WEBHOOK_SECRET tanimlanmali}
      INGEST_API_KEY: ${INGEST_API_KEY-}
    depends_on:
      - dekont

  hatirlatma:
    image: alpine:3
    container_name: hatirlatma
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET tanimlanmali}
      PANEL_URL: http://panel:3100
      # Varsayilan her gun 09:00 (container saati UTC'dir).
      CRON_SAATI: ${CRON_SAATI-0 9 * * *}
    volumes:
      - ./scripts/hatirlatma-zamanlayici.sh:/hatirlatma.sh:ro
    command: ["sh", "/hatirlatma.sh"]
    depends_on:
      - panel

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Ornek: ornek.com  -> dekont.ornek.com ve waha.ornek.com yayina cikar
      DOMAIN: "${DOMAIN:?DOMAIN tanimlanmali - ornek.com gibi}"
      ACME_EMAIL: "${ACME_EMAIL:?ACME_EMAIL tanimlanmali - sertifika uyarilari buraya gider}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Sertifikalar burada kalici: yeniden baslatinca Let's Encrypt'ten
      # tekrar sertifika istenmez (rate limit'e takilmamak icin onemli).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - panel
      - waha
      - dekont

volumes:
  waha_data:
  caddy_data:
  caddy_config:
